<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

const API_BASE = "https://nc-silver-api.diegortizdao.workers.dev/api";
const MESES = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
const COLORES_TIPO = {
  "Defectos x Control de Calidad": "#0f6e56",
  "Reclamos de Clientes": "#993c1d",
  "Registro Incompleto": "#5f5e5a",
  "Identificación de Bultos": "#185fa5",
  "Otros": "#854f0b",
  "Proveedores": "#72243e",
  "Material provisto por Cliente": "#3c3489",
  "Hallazgo de auditoría": "#3b6d11",
  "No conformidad": "#0f6e56",
  "Op. de mejora": "#185fa5",
};

function parseFechaParts(fecha) {
  if (!fecha) return { anio: null, mes: null };
  const [y, m] = String(fecha).split("-");
  return { anio: Number(y), mes: Number(m) };
}

function mapNC(row) {
  const { anio, mes } = parseFechaParts(row.fecha_produccion);
  return {
    numero: row.numero,
    numeroMostrado: row.numero_original || row.numero,
    tipoCategoria: row.tipo_nc_historico || row.tipo || "Sin clasificar",
    fecha: row.fecha_produccion,
    anio,
    mes,
    operario: normalizarOperario(row.operario) || "",
    maquina: row.maquina || "",
    producto: row.producto || "",
    cliente: row.cliente || "",
    devolucion: row.con_devolucion ? "SI" : "NO",
    estado: row.estado || "",
    documentoGeneradoEn: row.documento_generado_en || null,
  };
}

// Alias conocidos para nombres que aparecen truncados o distintos en el histórico.
// Agregar acá a mano cuando se detecte otro caso — evita fusionar automáticamente
// por "empieza igual", que podría mezclar personas distintas.
const ALIAS_OPERARIOS = {
  "graniera pablo": "Graniera Pablo Sebastian",
};

const PLACEHOLDERS_OPERARIO = /^(n\/a|n\/c|-+|--+|)$/i;

function quitarAcentos(s) {
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

// Devuelve el nombre normalizado para mostrar, o null si es un placeholder (N/A, --, etc.)
function normalizarOperario(nombreCrudo) {
  if (!nombreCrudo) return null;
  const limpio = nombreCrudo.trim();
  if (PLACEHOLDERS_OPERARIO.test(limpio)) return null;
  const clave = quitarAcentos(limpio).toLowerCase().replace(/\s+/g, " ").trim();
  if (ALIAS_OPERARIOS[clave]) return ALIAS_OPERARIOS[clave];
  return limpio;
}

function claveOperario(nombreNormalizado) {
  return quitarAcentos(nombreNormalizado).toLowerCase().replace(/\s+/g, " ").trim();
}

function Chip({ label, active, onClick }) {
  return (
    <button
      type="button"
      onClick={onClick}
      className={`px-3 py-1.5 rounded-full text-xs font-medium border transition ${
        active ? "bg-slate-800 text-white border-slate-800" : "bg-white text-slate-600 border-slate-300 hover:border-slate-400"
      }`}
    >
      {label}
    </button>
  );
}

function MetricCard({ label, value, sub }) {
  return (
    <div className="bg-slate-50 rounded-lg p-4">
      <p className="text-xs text-slate-500">{label}</p>
      <p className="text-2xl font-semibold text-slate-800 mt-1">{value}</p>
      {sub && <p className="text-xs text-slate-400 mt-1">{sub}</p>}
    </div>
  );
}

function BarChart({ data, maxLabel = 10 }) {
  const max = Math.max(...data.map((d) => d.value), 1);
  return (
    <div className="space-y-2">
      {data.slice(0, maxLabel).map((d) => (
        <div key={d.label} className="flex items-center gap-2">
          <span className="text-xs text-slate-600 w-40 truncate" title={d.label}>{d.label}</span>
          <div className="flex-1 bg-slate-100 rounded h-4 overflow-hidden">
            <div className="h-4 rounded" style={{ width: `${(d.value / max) * 100}%`, background: d.color || "#334155" }} />
          </div>
          <span className="text-xs font-medium text-slate-700 w-8 text-right">{d.value}</span>
        </div>
      ))}
    </div>
  );
}

function MonthlyTrend({ data }) {
  const max = Math.max(...data.map((d) => d.value), 1);
  const ALTO = 110; // px disponibles para la barra más alta
  return (
    <div className="flex items-end gap-1">
      {data.map((d) => {
        const h = d.value > 0 ? Math.max(3, Math.round((d.value / max) * ALTO)) : 0;
        return (
          <div key={d.label} className="flex-1 flex flex-col items-center justify-end gap-1" style={{ height: ALTO + 34 }}>
            <span className="text-[10px] text-slate-600 font-medium">{d.value > 0 ? d.value : ""}</span>
            <div className="w-full bg-slate-700 rounded-t" style={{ height: h }} title={`${d.label}: ${d.value}`} />
            <span className="text-[10px] text-slate-400">{d.label}</span>
          </div>
        );
      })}
    </div>
  );
}


// ---------- Fechas y exportación con rótulo ----------
// La API devuelve DATE como "2026-05-26T00:00:00.000Z": nos quedamos solo con la
// parte de fecha (sin convertir zona horaria) y la mostramos como dd/mm/aaaa.
function fmtFecha(v) {
  if (!v) return "";
  const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : String(v);
}
function fechaADate(txt) {
  const m = String(txt || "").match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  return m ? new Date(Date.UTC(Number(m[3]), Number(m[2]) - 1, Number(m[1]))) : null;
}

// Excel con el rótulo de los documentos controlados de Silver:
// logo | título | Fecha / Cód / Rev, y debajo la fila de encabezados y los datos.
// columnas: [{ header, key, width, tipo: "fecha"|"texto"|"num", izq: true }]
async function exportarExcelRotulado({ filas, columnas, hoja, archivo, titulo, cod, rev, fechaDoc, listas, filasExtra }) {
  const wb = new ExcelJS.Workbook();
  wb.calcProperties = { fullCalcOnLoad: true };
  const ws = wb.addWorksheet(hoja, { views: [{ state: "frozen", ySplit: 3 }] });
  ws.columns = columnas.map((c) => ({ key: c.key, width: c.width || 14 }));
  const n = columnas.length;
  // Hoja oculta "Listas": de ahí salen los desplegables (permite listas largas)
  const rangos = {};
  if (listas) {
    const wl = wb.addWorksheet("Listas", { state: "hidden" });
    Object.keys(listas).forEach((nombre, ci) => {
      wl.getCell(1, ci + 1).value = nombre;
      listas[nombre].forEach((v, ri) => { wl.getCell(ri + 2, ci + 1).value = v; });
      const col = wl.getColumn(ci + 1).letter;
      rangos[nombre] = `Listas!$${col}$2:$${col}$${listas[nombre].length + 1}`;
    });
  }
  const borde = { top: { style: "thin" }, left: { style: "thin" }, bottom: { style: "thin" }, right: { style: "thin" } };
  const gris = { type: "pattern", pattern: "solid", fgColor: { argb: "FFBFBFBF" } };

  // Rótulo (filas 1 y 2)
  ws.getRow(1).height = 30;
  ws.getRow(2).height = 30;
  const colLogo = Math.min(3, n - 4);           // el logo ocupa las primeras columnas
  ws.mergeCells(1, 1, 2, colLogo);
  const tIni = colLogo + 1, tFin = n - 3;       // título hasta antes del bloque Fecha/Cód/Rev
  ws.mergeCells(1, tIni, 2, tFin);
  ws.getCell(1, tIni).value = titulo;
  ws.getCell(1, tIni).font = { bold: true, size: 16 };
  ws.getCell(1, tIni).alignment = { horizontal: "center", vertical: "middle", wrapText: true };
  ws.mergeCells(1, n - 2, 1, n);
  ws.getCell(1, n - 2).value = `Fecha: ${fechaDoc}`;
  ws.getCell(1, n - 2).font = { bold: true, size: 14 };
  ws.getCell(1, n - 2).alignment = { horizontal: "center", vertical: "middle" };
  ws.mergeCells(2, n - 2, 2, n - 1);
  ws.getCell(2, n - 2).value = `Cód: ${cod}`;
  ws.getCell(2, n - 1).value = `Cód: ${cod}`;
  ws.getCell(2, n).value = `Rev: ${rev}`;
  [ws.getCell(2, n - 2), ws.getCell(2, n)].forEach((c) => {
    c.font = { bold: true, size: 14 };
    c.alignment = { horizontal: "center", vertical: "middle" };
  });
  for (let r = 1; r <= 2; r++) for (let c = 1; c <= n; c++) ws.getCell(r, c).border = borde;

  const imgId = wb.addImage({ base64: LOGO_SILVER_B64, extension: "png" });
  ws.addImage(imgId, { tl: { col: 0.15, row: 0.15 }, ext: { width: 200, height: 60 } });

  // Encabezados (fila 3)
  const h = ws.getRow(3);
  h.height = 34;
  columnas.forEach((c, i) => {
    const cell = h.getCell(i + 1);
    cell.value = c.header;
    cell.font = { bold: true, size: 10 };
    cell.fill = gris;
    cell.border = borde;
    cell.alignment = { horizontal: "center", vertical: "middle", wrapText: true };
  });

  // Datos (más algunas filas vacías con los desplegables para sumar OM a mano)
  const todas = filas.concat(Array.from({ length: filasExtra || 0 }, () => ({})));
  todas.forEach((f, idx) => {
    const row = ws.getRow(4 + idx);
    columnas.forEach((c, i) => {
      const cell = row.getCell(i + 1);
      let v = f[c.key];
      if (c.valid && rangos[c.valid]) {
        cell.dataValidation = { type: "list", allowBlank: true, showErrorMessage: true, errorTitle: "Valor no válido", error: "Elegí un valor de la lista.", formulae: [rangos[c.valid]] };
      }
      if (c.formula) {
        cell.value = { formula: c.formula(4 + idx), result: "" };
        cell.numFmt = "dd/mm/yyyy";
        cell.border = borde;
        cell.font = { size: 10 };
        cell.alignment = { horizontal: "center", vertical: "middle" };
        return;
      }
      if (c.tipo === "fecha") {
        const d = fechaADate(v);
        cell.value = d || (v || "");
        cell.numFmt = "dd/mm/yyyy";
      } else if (c.tipo === "num") {
        cell.value = v === "" || v == null ? "" : Number.isFinite(Number(v)) ? Number(v) : v;
      } else {
        cell.value = v == null ? "" : v;
      }
      cell.border = borde;
      cell.font = { size: 10 };
      cell.alignment = { horizontal: c.izq ? "left" : "center", vertical: "middle", wrapText: !!c.izq };
    });
  });

  ws.autoFilter = { from: { row: 3, column: 1 }, to: { row: 3, column: n } };
  ws.pageSetup = { orientation: "landscape", fitToPage: true, fitToWidth: 1, fitToHeight: 0, paperSize: 9 };
  ws.pageSetup.printTitlesRow = "1:3";

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = archivo;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// Previsualización del Word guardado en R2 (se dibuja en pantalla, sin descargar)
function VisorWord({ ncNumero, titulo, onCerrar }) {
  const cont = React.useRef(null);
  const [estado, setEstado] = useState("cargando");
  const [msg, setMsg] = useState("");
  const [blob, setBlob] = useState(null);

  useEffect(() => {
    let vivo = true;
    (async () => {
      try {
        const r = await fetch(`${API_BASE}/nc/${ncNumero}/documento`);
        if (!r.ok) {
          const d = await r.json().catch(() => ({}));
          throw new Error(d.error || `Error ${r.status}`);
        }
        const b = await r.blob();
        if (!vivo) return;
        setBlob(b);
        if (!window.docx) throw new Error("No se pudo cargar el visor de Word");
        await window.docx.renderAsync(b, cont.current, null, { inWrapper: true, breakPages: true, ignoreLastRenderedPageBreak: true });
        if (vivo) setEstado("ok");
      } catch (e) {
        if (vivo) { setEstado("error"); setMsg(e.message); }
      }
    })();
    return () => { vivo = false; };
  }, [ncNumero]);

  function descargar() {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `Q21_${titulo || ncNumero}.docx`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  return (
    <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-3" onClick={onCerrar}>
      <div className="bg-white rounded-lg shadow-xl w-full max-w-5xl h-[92vh] flex flex-col" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between px-4 py-2 border-b border-slate-200">
          <p className="text-sm font-medium text-slate-800">Registro Q.21 — Nº {titulo}</p>
          <div className="flex items-center gap-2">
            <button type="button" onClick={descargar} disabled={!blob} className="px-3 py-1.5 rounded-md text-xs font-medium border border-slate-300 text-slate-700 disabled:opacity-40">Descargar .docx</button>
            <button type="button" onClick={onCerrar} className="px-3 py-1.5 rounded-md text-xs font-medium bg-slate-800 text-white">Cerrar</button>
          </div>
        </div>
        <div className="flex-1 overflow-auto bg-slate-100 p-3">
          {estado === "cargando" && <p className="text-sm text-slate-500">Cargando documento…</p>}
          {estado === "error" && <p className="text-sm text-red-600">No se pudo mostrar el documento: {msg}</p>}
          <div ref={cont} />
        </div>
      </div>
    </div>
  );
}

// Combina las NC de un solo operario (nuevas, o migradas sin reparto — vienen en
// ncRaw con su propio campo "operario") con las NC migradas que se repartieron
// entre varios operarios (vienen en operariosData, una fila por operario), para
// no perder ninguna NC en el conteo de RRHH.
function combinarOperarios(ncRaw, operariosData) {
  const nroConOperarios = new Set(operariosData.map((o) => o.nc_numero));
  const combinado = [];
  ncRaw.forEach((n) => {
    if (nroConOperarios.has(n.numero)) return; // se resuelve abajo, vía operariosData
    combinado.push({ nc_numero: n.numero, operario: n.operario, fecha_produccion: n.fecha_produccion });
  });
  operariosData.forEach((o) => {
    combinado.push({ nc_numero: o.nc_numero, operario: o.operario, fecha_produccion: o.fecha_produccion });
  });
  return combinado;
}

function VistaOperarios({ ncRaw, operariosData }) {
  const combinado = useMemo(() => combinarOperarios(ncRaw, operariosData), [ncRaw, operariosData]);
  const anios = useMemo(() => [...new Set(combinado.map((r) => parseFechaParts(r.fecha_produccion).anio).filter(Boolean))].sort((a, b) => b - a), [combinado]);
  const [anioSel, setAnioSel] = useState(null);
  const [mesSel, setMesSel] = useState(null);

  const filtrados = useMemo(() => {
    return combinado.filter((r) => {
      const { anio, mes } = parseFechaParts(r.fecha_produccion);
      if (anioSel && anio !== anioSel) return false;
      if (mesSel && mes !== mesSel) return false;
      return true;
    });
  }, [combinado, anioSel, mesSel]);

  const porOperario = useMemo(() => {
    const map = {}; // clave normalizada -> { display, ncs: Set }
    filtrados.forEach((r) => {
      const nombre = normalizarOperario(r.operario);
      if (!nombre) return; // placeholder (N/A, --, etc.), se descarta
      const clave = claveOperario(nombre);
      if (!map[clave]) map[clave] = { display: nombre, ncs: new Set() };
      // Preferir como nombre a mostrar la variante que tenga tildes, si aparece
      if (nombre !== quitarAcentos(nombre) && map[clave].display === quitarAcentos(map[clave].display)) {
        map[clave].display = nombre;
      }
      map[clave].ncs.add(r.nc_numero);
    });
    return Object.values(map)
      .map(({ display, ncs }) => ({ operario: display, cantidad: ncs.size }))
      .sort((a, b) => b.cantidad - a.cantidad);
  }, [filtrados]);

  return (
    <div>
      <div className="bg-white rounded-lg border border-slate-200 p-4 mb-6 space-y-4">
        <p className="text-xs text-slate-500">
          Para RRHH: cuántas NC tuvo cada operario en el período elegido. Cada NC cuenta una sola vez por operario, aunque haya afectado varios productos.
        </p>
        <div>
          <p className="text-xs font-medium text-slate-500 mb-2">Año</p>
          <div className="flex flex-wrap gap-2">
            <Chip label="Todos" active={!anioSel} onClick={() => setAnioSel(null)} />
            {anios.map((a) => <Chip key={a} label={a} active={anioSel === a} onClick={() => setAnioSel(anioSel === a ? null : a)} />)}
          </div>
        </div>
        <div>
          <p className="text-xs font-medium text-slate-500 mb-2">Mes</p>
          <div className="flex flex-wrap gap-2">
            <Chip label="Todos" active={!mesSel} onClick={() => setMesSel(null)} />
            {MESES.map((m, i) => <Chip key={m} label={m} active={mesSel === i + 1} onClick={() => setMesSel(mesSel === i + 1 ? null : i + 1)} />)}
          </div>
        </div>
        <button
          type="button"
          onClick={() => exportarExcel(
            porOperario.map((r) => ({ Operario: r.operario, "Cantidad de NC": r.cantidad })),
            "Operarios", `Operarios_NC_${new Date().toISOString().slice(0, 10)}.xlsx`
          )}
          className="bg-slate-800 text-white text-xs font-medium rounded-md px-4 py-2 hover:bg-slate-700"
        >
          Exportar a Excel
        </button>
      </div>

      <div className="bg-white rounded-lg border border-slate-200 overflow-hidden">
        <div className="p-4 border-b border-slate-100">
          <h3 className="text-sm font-semibold text-slate-800">Operarios con NC en el período ({porOperario.length})</h3>
        </div>
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 text-xs">
            <tr>
              <th className="text-left px-4 py-2">Operario</th>
              <th className="text-left px-4 py-2">Cantidad de NC</th>
            </tr>
          </thead>
          <tbody>
            {porOperario.map((r) => (
              <tr key={r.operario} className="border-t border-slate-100">
                <td className="px-4 py-2 text-slate-700">{r.operario}</td>
                <td className="px-4 py-2 text-slate-600">{r.cantidad}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

const MESES_LARGO = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

// Arma la planilla "Base de datos NC" tal como la exige la norma (Cód: Q.11, Rev. 2),
// combinando las NC de un solo operario (nuevas, o migradas sin reparto) con las NC
// migradas que se repartieron entre varios operarios (una fila por operario, igual
// que en el archivo original).
function construirFilasQ11Oficial(ncRaw, operariosData) {
  const nroConOperarios = new Set(operariosData.map((o) => o.nc_numero));
  const filas = [];

  const filaBase = (n) => {
    const { anio, mes } = parseFechaParts(n.fecha_produccion);
    return {
      _fechaOrden: n.fecha_produccion || "",
      Item: null,
      Fecha: fmtFecha(n.fecha_produccion),
      Mes: mes ? MESES_LARGO[mes - 1] : "",
      "Nº NC": n.numero_original || n.numero || n.nc_numero,
      Apellido: n.cargado_por_apellido || "",
      Nombres: n.cargado_por_nombre || "",
      "Op.": n.operario_legajo || "",
      Apellido2: n.operario || "",
      "Estado de NC": n.estado || "",
      "Máq.": n.maquina || "",
      "AÑO": anio || "",
      Producto: n.producto || "",
      "Cliente/proveedor": n.cliente || "",
      "Cant. Prod. (unid.)": n.cantidad_piezas || "",
      Obsevaciones: n.descripcion || "",
      "Costos asociados": n.costo_asociado || "",
      "Tipo NC": n.tipo_nc_historico || n.tipo || "",
      Raiz: n.causa_raiz || "",
      "CON DEVOLUCION": n.con_devolucion ? "SI" : "NO",
    };
  };

  ncRaw.forEach((n) => {
    if (nroConOperarios.has(n.numero)) return; // se resuelve abajo, una fila por operario
    filas.push(filaBase(n));
  });

  operariosData.forEach((o) => {
    filas.push(filaBase(o));
  });

  filas.sort((a, b) => (a._fechaOrden || "").localeCompare(b._fechaOrden || ""));
  filas.forEach((f, i) => {
    f.Item = i + 1;
    delete f._fechaOrden;
  });
  return filas;
}

// ---------- Carga de OM históricas (alta individual, masiva por Excel y Word) ----------
const ORIGENES_OM = ["Hallazgo de auditoría", "Problema de producción", "Análisis del FODA", "Idea/propuesta"];
const ESTADOS_OM = ["Pendiente", "En proceso", "Implementado"];

// Acepta dd/mm/aaaa, d/m/aa o aaaa-mm-dd. Devuelve "aaaa-mm-dd", "" si viene vacía o null si es inválida.
function fechaEntradaAISO(txt) {
  const t = String(txt || "").trim();
  if (!t) return "";
  let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
  m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m) {
    const y = m[3].length === 2 ? "20" + m[3] : m[3];
    return `${y}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  }
  return null;
}
function coincidirLista(valor, lista) {
  const v = String(valor || "").trim().toLowerCase();
  if (!v) return "";
  return lista.find((x) => x.toLowerCase() === v) || null;
}

function VistaCargaOM({ onCambio }) {
  const [oms, setOms] = useState([]);
  const [errorLista, setErrorLista] = useState("");

  async function cargarOMs() {
    try {
      const r = await fetch(`${API_BASE}/om`);
      const d = await r.json();
      if (!Array.isArray(d)) throw new Error(d.error || "Respuesta inesperada");
      setOms(d);
      setErrorLista("");
    } catch (e) {
      setErrorLista("No se pudo leer el Q.25: " + e.message);
    }
  }
  useEffect(() => { cargarOMs(); }, []);

  async function postHistorica(o) {
    const res = await fetch(`${API_BASE}/om/historica`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(o),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
    return data;
  }

  // ---- A) Alta individual ----
  const vacio = { numeroOriginal: "", fecha: "", producto: "", descripcion: "", origen: "", proponente: "", responsable: "", fechaPrevista: "", beneficioEsperado: "", estado: "Pendiente", vigencia: "Sí", fechaVigencia: "" };
  const [f, setF] = useState(vacio);
  const [msgAlta, setMsgAlta] = useState(null);
  const [guardandoAlta, setGuardandoAlta] = useState(false);
  const upd = (k, v) => setF((x) => ({ ...x, [k]: v }));

  async function guardarAlta() {
    if (!f.numeroOriginal || !f.descripcion.trim()) {
      setMsgAlta({ ok: false, t: "Completá al menos el número y la descripción." });
      return;
    }
    setGuardandoAlta(true);
    try {
      await postHistorica(f);
      setMsgAlta({ ok: true, t: `OM Nº ${f.numeroOriginal} cargada.` });
      setF(vacio);
      await cargarOMs();
      if (onCambio) onCambio();
    } catch (e) {
      setMsgAlta({ ok: false, t: e.message });
    } finally {
      setGuardandoAlta(false);
    }
  }

  // ---- B) Carga masiva por Excel ----
  const COLS_PLANTILLA = ["Nº OM", "Fecha", "Producto / proceso", "Descripción", "Origen", "Proponente", "Responsable de implementación", "Fecha prevista", "Beneficio esperado", "Estado", "Última revisión de vigencia"];
  const [filasXls, setFilasXls] = useState([]);
  const [subiendoXls, setSubiendoXls] = useState(false);

  function bajarPlantilla(conDatos) {
    const filasOM = conDatos
      ? omsOrdenadas.slice().reverse().map((o) => [
          o.numero_original || o.nc_numero, fmtFecha(o.fecha_produccion), o.producto && o.producto !== "—" ? o.producto : "",
          o.descripcion || "", o.origen || "", o.proponente || "", o.responsable || "", fmtFecha(o.fecha_prevista),
          o.beneficio_esperado || "", o.estado || "", fmtFecha(o.fecha_vigencia),
        ])
      : [[1, "15/03/2024", "Inyectora 6", "Ejemplo: instalar sensor de presión en la línea de agua", "Idea/propuesta", "Ortiz Diego", "Canaberro Mariano", "30/06/2024", "Reducir paradas por falta de agua", "Implementado", "15/09/2026"]];
    const ws = XLSX.utils.aoa_to_sheet([COLS_PLANTILLA, ...filasOM]);
    ws["!cols"] = COLS_PLANTILLA.map((c, i) => ({ wch: i === 3 ? 50 : Math.max(14, c.length + 2) }));
    const ops = XLSX.utils.aoa_to_sheet([["Origen", "Estado"], ...Array.from({ length: 4 }, (_, i) => [ORIGENES_OM[i], ESTADOS_OM[i] || ""])]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "OM históricas");
    XLSX.utils.book_append_sheet(wb, ops, "Opciones válidas");
    XLSX.writeFile(wb, conDatos ? "Q25_completar_OM.xlsx" : "Plantilla_carga_OM_historicas.xlsx");
  }

  async function leerExcel(file) {
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: false });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const matriz = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: false, dateNF: "dd/mm/yyyy" });
    const norm = (t) => String(t || "").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    // Encabezados reconocidos (plantilla o Excel exportado del Q.25 con rótulo)
    const ALIAS = {
      numero: ["nº om", "no om", "nº", "n°", "no", "numero", "n° om"],
      fecha: ["fecha"],
      producto: ["producto / proceso", "producto"],
      descripcion: ["descripcion"],
      origen: ["origen"],
      proponente: ["proponente"],
      responsable: ["responsable de implementacion", "responsable"],
      prevista: ["fecha prevista", "fecha prevista de implementacion"],
      beneficio: ["beneficio esperado", "beneficio"],
      estado: ["estado"],
      vigencia: ["vigencia"],
      revision: ["ultima revision de vigencia", "fecha de vigencia", "fecha vigencia"],
    };
    let hdr = -1;
    for (let i = 0; i < Math.min(matriz.length, 8); i++) {
      const cels = matriz[i].map(norm);
      if (cels.some((c) => ALIAS.numero.includes(c)) && cels.some((c) => c === "descripcion")) { hdr = i; break; }
    }
    if (hdr < 0) {
      setFilasXls([{ id: 0, errores: ["encabezados"], estado_carga: "error", mensaje: "No encontré la fila de encabezados (Nº y Descripción)", datos: { numeroOriginal: "", fecha: "", descripcion: "", origen: "", responsable: "", estado: "" } }]);
      return;
    }
    const idx = {};
    matriz[hdr].map(norm).forEach((c, i) => {
      Object.keys(ALIAS).forEach((k) => { if (idx[k] === undefined && ALIAS[k].includes(c)) idx[k] = i; });
    });
    const tomar = (r, k) => (idx[k] === undefined ? "" : String(r[idx[k]] ?? "").trim());
    setFilasXls(matriz.slice(hdr + 1)
      .filter((r) => tomar(r, "numero") || tomar(r, "descripcion"))
      .map((r, i) => {
        const errores = [];
        const num = Number(tomar(r, "numero"));
        if (!num) errores.push("falta el Nº");
        if (!tomar(r, "descripcion")) errores.push("falta la descripción");
        const fecha = fechaEntradaAISO(tomar(r, "fecha"));
        const prev = fechaEntradaAISO(tomar(r, "prevista"));
        const rev = fechaEntradaAISO(tomar(r, "revision"));
        if (fecha === null) errores.push("fecha inválida");
        if (prev === null) errores.push("fecha prevista inválida");
        if (rev === null) errores.push("fecha de vigencia inválida");
        const origen = coincidirLista(tomar(r, "origen"), ORIGENES_OM);
        const estado = coincidirLista(tomar(r, "estado"), ESTADOS_OM);
        const vigencia = coincidirLista(norm(tomar(r, "vigencia")) === "si" ? "Sí" : tomar(r, "vigencia"), ["Sí", "No"]);
        if (origen === null) errores.push("origen no válido");
        if (estado === null) errores.push("estado no válido");
        if (vigencia === null) errores.push("vigencia no válida");
        return {
          id: i, errores, estado_carga: errores.length ? "error" : "pendiente", mensaje: errores.join(", "),
          datos: {
            numeroOriginal: num, fecha: fecha || "", producto: tomar(r, "producto"), descripcion: tomar(r, "descripcion"),
            origen: origen || "", proponente: tomar(r, "proponente"), responsable: tomar(r, "responsable"),
            fechaPrevista: prev || "", beneficioEsperado: tomar(r, "beneficio"), estado: estado || "",
            vigencia: vigencia || "", fechaVigencia: rev || "", actualizar: true,
          },
        };
      }));
  }

  async function cargarFilasXls() {
    setSubiendoXls(true);
    for (const fila of filasXls) {
      if (fila.errores.length || fila.estado_carga === "ok") continue;
      try {
        await postHistorica(fila.datos);
        setFilasXls((prev) => prev.map((x) => (x.id === fila.id ? { ...x, estado_carga: "ok", mensaje: "Cargada" } : x)));
      } catch (e) {
        setFilasXls((prev) => prev.map((x) => (x.id === fila.id ? { ...x, estado_carga: "error", mensaje: e.message } : x)));
      }
    }
    setSubiendoXls(false);
    await cargarOMs();
    if (onCambio) onCambio();
  }

  // ---- C) Word de cada OM: si la OM no existe, se crea con los datos del nombre del archivo ----
  // Ej.: "Mejora.Nº43 - Calibrar el calibre grande 02-05-13.docx" -> Nº 43, 02/05/2013, descripción.
  const [archivos, setArchivos] = useState([]);
  const [subiendoWord, setSubiendoWord] = useState(false);
  const omsOrdenadas = oms.slice().sort((a, b) => (b.numero_original || b.nc_numero) - (a.numero_original || a.nc_numero));

  function interpretarNombreOM(nombre) {
    let base = nombre.replace(/\.docx$/i, "").trim();
    let fecha = "";
    const mf = base.match(/(\d{1,2})[-.](\d{1,2})[-.](\d{2,4})\s*$/);
    if (mf) {
      const y = mf[3].length === 2 ? "20" + mf[3] : mf[3];
      fecha = `${y}-${mf[2].padStart(2, "0")}-${mf[1].padStart(2, "0")}`;
      base = base.slice(0, mf.index).trim();
    }
    let numero = "";
    const mn = base.match(/N[º°o]?\.?\s*(\d{1,6})/i) || base.match(/(\d{1,6})/);
    if (mn) {
      numero = Number(mn[1]);
      base = base.slice(mn.index + mn[0].length);
    }
    const descripcion = base.replace(/^[\s\-–.:]+/, "").trim();
    return { numero, fecha, descripcion };
  }

  function agregarWord(fileList) {
    const nuevos = Array.from(fileList).map((file) => {
      const { numero, fecha, descripcion } = interpretarNombreOM(file.name);
      return { id: `${file.name}-${Date.now()}-${Math.random()}`, file, numero, fecha, descripcion, estado: "pendiente", mensaje: "" };
    });
    setArchivos((prev) => [...prev, ...nuevos]);
  }
  function editarArchivo(id, campo, valor) {
    setArchivos((prev) => prev.map((x) => (x.id === id ? { ...x, [campo]: valor, mensaje: "" } : x)));
  }
  const existeOM = (n) => oms.find((o) => (o.numero_original || o.nc_numero) === Number(n));

  async function subirWords() {
    setSubiendoWord(true);
    for (const a of archivos) {
      if (a.estado === "ok" || !a.numero) continue;
      setArchivos((prev) => prev.map((x) => (x.id === a.id ? { ...x, estado: "subiendo", mensaje: "" } : x)));
      try {
        let ncNumero = existeOM(a.numero)?.nc_numero;
        let creada = false;
        if (!ncNumero) {
          if (!String(a.descripcion).trim()) throw new Error("falta la descripción para crear la OM");
          const fila = await postHistorica({
            numeroOriginal: a.numero, fecha: a.fecha, producto: "", descripcion: a.descripcion,
            origen: "", proponente: "", responsable: "", fechaPrevista: "", beneficioEsperado: "",
            estado: "", vigencia: "Sí", fechaVigencia: "",
          });
          ncNumero = fila.nc_numero;
          creada = true;
        }
        const res = await fetch(`${API_BASE}/nc/${ncNumero}/documento`, {
          method: "PUT",
          headers: { "Content-Type": "application/vnd.openxmlformats-officedocument.wordprocessingml.document" },
          body: await a.file.arrayBuffer(),
        });
        if (!res.ok) {
          const d = await res.json().catch(() => ({}));
          throw new Error(d.error || `Error ${res.status}`);
        }
        setArchivos((prev) => prev.map((x) => (x.id === a.id ? { ...x, estado: "ok", mensaje: creada ? "OM creada + Word" : "Word subido" } : x)));
      } catch (e) {
        setArchivos((prev) => prev.map((x) => (x.id === a.id ? { ...x, estado: "error", mensaje: e.message } : x)));
      }
    }
    setSubiendoWord(false);
    await cargarOMs();
    if (onCambio) onCambio();
  }

  const inp = "w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm";
  const lbl = "block text-xs font-medium text-slate-600 mb-1";
  const campo = (etq, k, tipo = "text") => (
    <div><label className={lbl}>{etq}</label><input type={tipo} value={f[k]} onChange={(e) => upd(k, e.target.value)} className={inp} /></div>
  );
  const sinWord = oms.filter((o) => !o.documento_generado_en).length;

  return (
    <div className="space-y-5">
      {errorLista && <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-md p-3">{errorLista}</div>}

      <div className="bg-white rounded-lg border border-slate-200 p-5 space-y-3">
        <h3 className="text-sm font-semibold text-slate-800">1 · Cargar una OM histórica</h3>
        <p className="text-xs text-slate-500">Cada OM entra al Q.25 con su número y su fecha originales. Para muchas a la vez usá la carga por Excel (punto 2).</p>
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
          {campo("Nº de OM *", "numeroOriginal", "number")}
          {campo("Fecha de la OM", "fecha", "date")}
          {campo("Producto / proceso", "producto")}
          <div><label className={lbl}>Origen</label>
            <select value={f.origen} onChange={(e) => upd("origen", e.target.value)} className={inp}>
              <option value="">Seleccionar</option>{ORIGENES_OM.map((o) => <option key={o} value={o}>{o}</option>)}
            </select></div>
          {campo("Proponente", "proponente")}
          {campo("Responsable de implementación", "responsable")}
          {campo("Fecha prevista", "fechaPrevista", "date")}
          <div><label className={lbl}>Estado</label>
            <select value={f.estado} onChange={(e) => upd("estado", e.target.value)} className={inp}>
              {ESTADOS_OM.map((o) => <option key={o} value={o}>{o}</option>)}
            </select></div>
          {campo("Última revisión de vigencia", "fechaVigencia", "date")}
        </div>
        <div><label className={lbl}>Descripción *</label><textarea rows={2} value={f.descripcion} onChange={(e) => upd("descripcion", e.target.value)} className={inp} /></div>
        <div><label className={lbl}>Beneficio esperado</label><textarea rows={2} value={f.beneficioEsperado} onChange={(e) => upd("beneficioEsperado", e.target.value)} className={inp} /></div>
        <div className="flex items-center gap-3">
          <button type="button" disabled={guardandoAlta} onClick={guardarAlta} className="px-4 py-2 rounded-md text-sm font-medium bg-slate-800 text-white disabled:opacity-50">
            {guardandoAlta ? "Guardando…" : "Guardar OM"}
          </button>
          {msgAlta && <span className={`text-xs ${msgAlta.ok ? "text-green-600" : "text-red-600"}`}>{msgAlta.t}</span>}
        </div>
      </div>

      <div className="bg-white rounded-lg border border-slate-200 p-5 space-y-3">
        <h3 className="text-sm font-semibold text-slate-800">2 · Carga masiva por Excel</h3>
        <p className="text-xs text-slate-500">
          Bajá la plantilla, completala (una fila por OM, fechas dd/mm/aaaa) y subila. Se revisa fila por fila antes de cargar;
          si el número ya existe se actualiza esa OM (no se duplica); así podés bajar las OM ya cargadas, completar en Excel lo que falte y volver a subirlas.
        </p>
        <div className="flex flex-wrap items-center gap-3">
          <button type="button" onClick={() => bajarPlantilla(false)} className="px-3 py-2 rounded-md text-sm border border-slate-300 text-slate-700">Descargar plantilla vacía</button>
          <button type="button" disabled={oms.length === 0} onClick={() => bajarPlantilla(true)} className="px-3 py-2 rounded-md text-sm border border-slate-300 text-slate-700 disabled:opacity-40">Descargar con las {oms.length} OM ya cargadas</button>
          <label className="px-3 py-2 rounded-md text-sm bg-slate-800 text-white cursor-pointer">
            Elegir Excel completado
            <input type="file" accept=".xlsx,.xls" className="hidden" onChange={(e) => { if (e.target.files[0]) leerExcel(e.target.files[0]); e.target.value = ""; }} />
          </label>
        </div>
        {filasXls.length > 0 && (
          <div className="space-y-2">
            <div className="overflow-x-auto border border-slate-200 rounded-md">
              <table className="w-full text-xs">
                <thead className="bg-slate-50 text-slate-500"><tr>
                  {["Nº", "Fecha", "Descripción", "Origen", "Responsable", "Estado", "Resultado"].map((h) => <th key={h} className="px-2 py-1.5 text-left">{h}</th>)}
                </tr></thead>
                <tbody>
                  {filasXls.map((x) => (
                    <tr key={x.id} className="border-t border-slate-100">
                      <td className="px-2 py-1">{x.datos.numeroOriginal || "—"}</td>
                      <td className="px-2 py-1 whitespace-nowrap">{fmtFecha(x.datos.fecha)}</td>
                      <td className="px-2 py-1 max-w-xs truncate" title={x.datos.descripcion}>{x.datos.descripcion}</td>
                      <td className="px-2 py-1">{x.datos.origen}</td>
                      <td className="px-2 py-1">{x.datos.responsable}</td>
                      <td className="px-2 py-1">{x.datos.estado}</td>
                      <td className={`px-2 py-1 ${x.estado_carga === "ok" ? "text-green-600" : x.estado_carga === "error" ? "text-red-600" : "text-slate-400"}`}>{x.mensaje || "Lista"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <button type="button" disabled={subiendoXls || filasXls.every((x) => x.errores.length || x.estado_carga === "ok")} onClick={cargarFilasXls} className="px-4 py-2 rounded-md text-sm font-medium bg-slate-800 text-white disabled:opacity-50">
              {subiendoXls ? "Cargando…" : `Cargar ${filasXls.filter((x) => !x.errores.length && x.estado_carga !== "ok").length} OM`}
            </button>
          </div>
        )}
      </div>

      <div className="bg-white rounded-lg border border-slate-200 p-5 space-y-3">
        <h3 className="text-sm font-semibold text-slate-800">3 · Cargar los Word de las OM (crea la OM si no existe)</h3>
        <p className="text-xs text-slate-500">
          Subí los .docx tal como los tenés. Del nombre del archivo se toman el número, la fecha (al final, dd-mm-aa) y la descripción;
          podés corregirlos antes de subir. Si la OM no existe en el Q.25 se crea, y si ya existe solo se le adjunta el Word.
          Origen, responsable y estado los completás después (en la app de captura → Q.25 · Mejora, o por Excel en el punto 2).
          Hoy hay {oms.length} OM en el Q.25 y {sinWord} sin Word.
        </p>
        <label className="flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-lg p-5 cursor-pointer hover:border-slate-400 text-sm text-slate-500">
          Elegí uno o varios .docx
          <input type="file" accept=".docx" multiple className="hidden" onChange={(e) => { agregarWord(e.target.files); e.target.value = ""; }} />
        </label>
        {archivos.length > 0 && (
          <div className="space-y-2">
            {archivos.map((a) => {
              const ex = a.numero ? existeOM(a.numero) : null;
              const bloq = a.estado === "ok" || a.estado === "subiendo";
              return (
                <div key={a.id} className="border border-slate-200 rounded-md p-2 text-sm space-y-1.5">
                  <div className="flex items-center gap-2">
                    <span className="flex-1 truncate text-xs text-slate-500" title={a.file.name}>{a.file.name}</span>
                    <span className={`text-xs whitespace-nowrap ${a.estado === "ok" ? "text-green-600" : a.estado === "error" ? "text-red-600" : "text-slate-500"}`}>
                      {a.estado === "subiendo" ? "Subiendo…" : a.mensaje || (a.numero ? (ex ? "OM existente: se adjunta el Word" : "OM nueva: se crea") : "Falta el número")}
                    </span>
                    {a.estado !== "subiendo" && <button type="button" onClick={() => setArchivos((prev) => prev.filter((x) => x.id !== a.id))} className="text-slate-400 hover:text-slate-600">×</button>}
                  </div>
                  <div className="flex flex-wrap items-center gap-2">
                    <input type="number" disabled={bloq} value={a.numero} onChange={(e) => editarArchivo(a.id, "numero", e.target.value === "" ? "" : Number(e.target.value))} className="w-20 border border-slate-300 rounded-md px-2 py-1 text-xs" title="Nº de OM" />
                    <input type="date" disabled={bloq} value={a.fecha} onChange={(e) => editarArchivo(a.id, "fecha", e.target.value)} className="border border-slate-300 rounded-md px-2 py-1 text-xs" />
                    <input type="text" disabled={bloq || !!ex} value={ex ? ex.descripcion || "" : a.descripcion} onChange={(e) => editarArchivo(a.id, "descripcion", e.target.value)} className="flex-1 min-w-[200px] border border-slate-300 rounded-md px-2 py-1 text-xs disabled:bg-slate-50" placeholder="Descripción de la OM" />
                  </div>
                </div>
              );
            })}
            <button type="button" disabled={subiendoWord || archivos.every((a) => !a.numero || a.estado === "ok")} onClick={subirWords} className="px-4 py-2 rounded-md text-sm font-medium bg-slate-800 text-white disabled:opacity-50">
              {subiendoWord ? "Subiendo…" : `Subir ${archivos.filter((a) => a.numero && a.estado !== "ok").length} archivo(s)`}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}


// Extrae el primer número de 3 a 6 dígitos del nombre de archivo — así detectamos
// solos el Nº de NC en nombres tipo "NC_921.docx" o "921 - Pasa Cabo Octogonal.docx".
function detectarNumeroDesdeNombre(nombreArchivo) {
  const match = nombreArchivo.match(/\d{3,6}/);
  return match ? Number(match[0]) : null;
}

// ---------- Q.25 Registro de oportunidades de mejora (Rev 0) ----------
function VistaQ25() {
  const [om, setOm] = useState(null);
  const [error, setError] = useState(null);
  const [editando, setEditando] = useState(null);
  const [f, setF] = useState(null);
  const [guardando, setGuardando] = useState(false);
  const [busqueda, setBusqueda] = useState("");
  const [filtroEstado, setFiltroEstado] = useState("");
  const [soloVencidas, setSoloVencidas] = useState(false);

  async function cargar() {
    try {
      const r = await fetch(`${API_BASE}/om`);
      const d = await r.json();
      if (!Array.isArray(d)) throw new Error(d.error || "Respuesta inesperada");
      setOm(d);
    } catch (e) {
      setError(e.message);
    }
  }
  useEffect(() => { cargar(); }, []);

  const d10 = (v) => (v ? String(v).slice(0, 10) : "");
  const hoy = new Date().toISOString().slice(0, 10);
  const proxima = (iso) => {
    if (!iso) return "";
    const fch = new Date(iso.slice(0, 10) + "T00:00:00Z");
    fch.setUTCMonth(fch.getUTCMonth() + 6);
    return fch.toISOString().slice(0, 10);
  };
  const vencida = (o) => o.vigencia === "Sí" && (!o.fecha_vigencia || proxima(d10(o.fecha_vigencia)) < hoy);
  const num = (o) => o.numero_original || o.nc_numero;

  if (error) return <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-md p-3">No se pudo cargar la Q.25: {error}</div>;
  if (!om) return <p className="text-sm text-slate-400">Cargando Q.25...</p>;

  const cuenta = (fn) => om.filter(fn).length;
  const origenes = [...new Set(om.map((o) => o.origen || "Sin completar"))];

  const visibles = om.filter((o) => {
    if (filtroEstado === "__sin" && o.estado) return false;
    if (filtroEstado && filtroEstado !== "__sin" && o.estado !== filtroEstado) return false;
    if (soloVencidas && !vencida(o)) return false;
    const q = busqueda.trim().toLowerCase();
    if (q && !`${num(o)} ${o.descripcion || ""} ${o.proponente || ""} ${o.responsable || ""}`.toLowerCase().includes(q)) return false;
    return true;
  });

  function abrir(o) {
    setEditando(o.nc_numero);
    setF({
      fecha: d10(o.fecha_produccion), descripcion: o.descripcion || "", origen: o.origen || "", proponente: o.proponente || "",
      responsable: o.responsable || "", fechaPrevista: d10(o.fecha_prevista), beneficioEsperado: o.beneficio_esperado || "",
      estado: o.estado || "", vigencia: o.vigencia || "Sí", fechaVigencia: d10(o.fecha_vigencia),
    });
  }
  const upd = (k, v) => setF((x) => ({ ...x, [k]: v }));

  async function guardar() {
    setGuardando(true);
    try {
      const res = await fetch(`${API_BASE}/om/${editando}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(f),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
      setEditando(null);
      await cargar();
    } catch (e) {
      setError("No se pudo guardar: " + e.message);
    } finally {
      setGuardando(false);
    }
  }

  function exportar() {
    const filas = om.slice().sort((a, b) => num(a) - num(b)).map((o) => ({
      f: fmtFecha(o.fecha_produccion), n: num(o), origen: o.origen || "", prop: o.proponente || "",
      desc: o.descripcion || "", resp: o.responsable || "", prev: fmtFecha(o.fecha_prevista),
      ben: o.beneficio_esperado || "", est: o.estado || "", vig: o.vigencia || "",
      fvig: fmtFecha(o.fecha_vigencia),
    }));
    exportarExcelRotulado({
      filas, hoja: "Q.25 Rev 0", archivo: "Q25_Registro_Oportunidades_Mejora_Rev0.xlsx",
      titulo: "Registro de oportunidades de mejora", cod: "Q.25", rev: "0", fechaDoc: Q25_FECHA_DOC,
      filasExtra: 30,
      listas: { origen: ORIGENES_OM, estado: ESTADOS_OM, vigencia: ["Sí", "No"], personas: PERSONAS_SILVER },
      columnas: [
        { header: "Fecha", key: "f", width: 12, tipo: "fecha" },
        { header: "Nº", key: "n", width: 8, tipo: "num" },
        { header: "Origen", key: "origen", width: 22, valid: "origen" },
        { header: "Proponente", key: "prop", width: 20, valid: "personas" },
        { header: "Descripción", key: "desc", width: 50, izq: true },
        { header: "Responsable de implementación", key: "resp", width: 22, valid: "personas" },
        { header: "Fecha prevista de implementación", key: "prev", width: 16, tipo: "fecha" },
        { header: "Beneficio esperado", key: "ben", width: 40, izq: true },
        { header: "Estado", key: "est", width: 13, valid: "estado" },
        { header: "Vigencia", key: "vig", width: 10, valid: "vigencia" },
        { header: "Fecha de vigencia", key: "fvig", width: 14, tipo: "fecha" },
        { header: "Próxima revisión", key: "prox", width: 14, formula: (r) => `IF(AND(J${r}="Sí",K${r}<>""),EDATE(K${r},6),"")` },
      ],
    });
  }

  const kpi = (t, v, c) => (
    <div className="bg-white border border-slate-200 rounded-lg p-3">
      <div className="text-xs text-slate-500">{t}</div>
      <div className={`text-2xl font-semibold ${c || "text-slate-800"}`}>{v}</div>
    </div>
  );
  const inp = "w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm";
  const lbl = "block text-xs font-medium text-slate-600 mb-1";
  // Proponente/responsable: lista de Silver (y si la OM trae otro nombre, se conserva)
  const opcionesPersonas = (actual) => (actual && !PERSONAS_SILVER.includes(actual) ? [actual, ...PERSONAS_SILVER] : PERSONAS_SILVER);

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <h2 className="text-base font-semibold text-slate-800">Q.25 — Registro de oportunidades de mejora (Rev. 0)</h2>
        <button type="button" onClick={exportar} className="px-3 py-2 rounded-md text-sm font-medium bg-slate-800 text-white">Exportar a Excel</button>
      </div>
      <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-4">
        {kpi("Total OM", om.length)}
        {kpi("Implementadas", cuenta((o) => o.estado === "Implementado"), "text-green-700")}
        {kpi("En proceso", cuenta((o) => o.estado === "En proceso"), "text-amber-600")}
        {kpi("Pendientes", cuenta((o) => o.estado === "Pendiente"))}
        {kpi("Revisiones vencidas", cuenta(vencida), "text-red-600")}
      </div>
      <div className="text-xs text-slate-600 mb-3">
        Por origen: {origenes.map((g) => `${g}: ${cuenta((o) => (o.origen || "Sin completar") === g)}`).join(" · ") || "—"}
        {" · "}Vigentes: {cuenta((o) => o.vigencia === "Sí")}
      </div>

      <div className="flex flex-wrap items-center gap-2 mb-3">
        <input type="text" value={busqueda} onChange={(e) => setBusqueda(e.target.value)} placeholder="Buscar por Nº, descripción o persona…" className="border border-slate-300 rounded-md px-2 py-1.5 text-sm w-72" />
        <select value={filtroEstado} onChange={(e) => setFiltroEstado(e.target.value)} className="border border-slate-300 rounded-md px-2 py-1.5 text-sm">
          <option value="">Todos los estados</option>
          {ESTADOS_OM.map((e) => <option key={e} value={e}>{e}</option>)}
          <option value="__sin">Sin estado</option>
        </select>
        <label className="text-xs text-slate-600 flex items-center gap-1">
          <input type="checkbox" checked={soloVencidas} onChange={(e) => setSoloVencidas(e.target.checked)} /> Solo revisión vencida
        </label>
        <span className="text-xs text-slate-400 ml-auto">{visibles.length} de {om.length}</span>
      </div>

      <div className="overflow-x-auto bg-white border border-slate-200 rounded-lg">
        <table className="min-w-full text-xs">
          <thead className="bg-slate-50 text-slate-600">
            <tr>{["Fecha","Nº","Origen","Proponente","Descripción","Responsable","Prevista","Beneficio","Estado","Vigencia","Fecha vigencia","Próxima revisión",""].map((h) => <th key={h} className="text-left px-2 py-2 font-medium">{h}</th>)}</tr>
          </thead>
          <tbody>
            {visibles.map((o) => (
              <React.Fragment key={o.nc_numero}>
                <tr className="border-t border-slate-100 align-top">
                  <td className="px-2 py-2 whitespace-nowrap">{fmtFecha(o.fecha_produccion)}</td>
                  <td className="px-2 py-2 whitespace-nowrap">
                    {o.documento_generado_en ? <EnlaceWord ncNumero={o.nc_numero} etiqueta={String(num(o))} /> : num(o)}
                  </td>
                  <td className="px-2 py-2">{o.origen || <span className="text-slate-400">—</span>}</td>
                  <td className="px-2 py-2">{o.proponente || ""}</td>
                  <td className="px-2 py-2 max-w-xs">{o.descripcion}</td>
                  <td className="px-2 py-2">{o.responsable || ""}</td>
                  <td className="px-2 py-2 whitespace-nowrap">{fmtFecha(o.fecha_prevista)}</td>
                  <td className="px-2 py-2 max-w-xs">{o.beneficio_esperado || ""}</td>
                  <td className="px-2 py-2">{o.estado || <span className="text-slate-400">—</span>}</td>
                  <td className="px-2 py-2">{o.vigencia || ""}</td>
                  <td className="px-2 py-2 whitespace-nowrap">{fmtFecha(o.fecha_vigencia)}</td>
                  <td className="px-2 py-2 whitespace-nowrap">
                    {o.vigencia !== "Sí" ? "" : vencida(o)
                      ? <span className="text-red-600 font-medium">Vencida{o.fecha_vigencia ? " (" + fmtFecha(proxima(d10(o.fecha_vigencia))) + ")" : ""}</span>
                      : fmtFecha(proxima(d10(o.fecha_vigencia)))}
                  </td>
                  <td className="px-2 py-2">
                    <button type="button" onClick={() => (editando === o.nc_numero ? setEditando(null) : abrir(o))} className="text-blue-600 hover:underline">
                      {editando === o.nc_numero ? "Cerrar" : "Editar"}
                    </button>
                  </td>
                </tr>
                {editando === o.nc_numero && f && (
                  <tr className="bg-slate-50">
                    <td colSpan={13} className="px-3 py-3">
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div><label className={lbl}>Fecha de la OM</label><input type="date" value={f.fecha} onChange={(e) => upd("fecha", e.target.value)} className={inp} /></div>
                        <div><label className={lbl}>Origen</label>
                          <select value={f.origen} onChange={(e) => upd("origen", e.target.value)} className={inp}>
                            <option value="">Seleccionar</option>{ORIGENES_OM.map((x) => <option key={x} value={x}>{x}</option>)}
                          </select></div>
                        <div><label className={lbl}>Estado</label>
                          <select value={f.estado} onChange={(e) => upd("estado", e.target.value)} className={inp}>
                            <option value="">Seleccionar</option>{ESTADOS_OM.map((x) => <option key={x} value={x}>{x}</option>)}
                          </select></div>
                        <div><label className={lbl}>Proponente</label>
                          <select value={f.proponente} onChange={(e) => upd("proponente", e.target.value)} className={inp}>
                            <option value="">Seleccionar</option>{opcionesPersonas(f.proponente).map((x) => <option key={x} value={x}>{x}</option>)}
                          </select></div>
                        <div><label className={lbl}>Responsable de implementación</label>
                          <select value={f.responsable} onChange={(e) => upd("responsable", e.target.value)} className={inp}>
                            <option value="">Seleccionar</option>{opcionesPersonas(f.responsable).map((x) => <option key={x} value={x}>{x}</option>)}
                          </select></div>
                        <div><label className={lbl}>Fecha prevista de implementación</label><input type="date" value={f.fechaPrevista} onChange={(e) => upd("fechaPrevista", e.target.value)} className={inp} /></div>
                        <div><label className={lbl}>Vigencia</label>
                          <select value={f.vigencia} onChange={(e) => upd("vigencia", e.target.value)} className={inp}>
                            <option value="Sí">Sí</option><option value="No">No</option>
                          </select></div>
                        <div><label className={lbl}>Fecha de vigencia (última revisión)</label>
                          <div className="flex gap-2">
                            <input type="date" value={f.fechaVigencia} onChange={(e) => upd("fechaVigencia", e.target.value)} className={inp} />
                            <button type="button" onClick={() => { upd("vigencia", "Sí"); upd("fechaVigencia", hoy); }} className="px-2 text-xs rounded-md border border-slate-300 whitespace-nowrap">Revisada hoy</button>
                          </div></div>
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3">
                        <div><label className={lbl}>Descripción</label><textarea rows={2} value={f.descripcion} onChange={(e) => upd("descripcion", e.target.value)} className={inp} /></div>
                        <div><label className={lbl}>Beneficio esperado</label><textarea rows={2} value={f.beneficioEsperado} onChange={(e) => upd("beneficioEsperado", e.target.value)} className={inp} /></div>
                      </div>
                      <div className="flex gap-2 mt-3">
                        <button type="button" disabled={guardando} onClick={guardar} className="px-4 py-2 rounded-md text-sm font-medium bg-slate-800 text-white disabled:opacity-50">{guardando ? "Guardando…" : "Guardar"}</button>
                        <button type="button" onClick={() => setEditando(null)} className="px-4 py-2 rounded-md text-sm border border-slate-300 text-slate-700">Cancelar</button>
                      </div>
                    </td>
                  </tr>
                )}
              </React.Fragment>
            ))}
            {visibles.length === 0 && <tr><td colSpan={13} className="px-3 py-6 text-center text-slate-400">No hay oportunidades de mejora con ese filtro.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}


// Sube documentos Word históricos (cargados a mano en el pasado, antes de esta app)
// para las NC migradas del Q.11 histórico, así el auditor tiene el mismo link 📄 que
// las NC nuevas aunque no hayan pasado por el flujo digital.
function VistaCargaHistorica({ ncRaw, onSubido }) {
  const migradas = ncRaw
    .filter((n) => n.numero_original != null && n.tipo !== "Op. de mejora")
    .slice()
    .sort((a, b) => (b.numero_original || 0) - (a.numero_original || 0));

  const [archivos, setArchivos] = useState([]); // { id, file, numeroInterno, estado, mensaje }

  function agregarArchivos(fileList) {
    const nuevos = Array.from(fileList).map((file) => {
      const numeroDetectado = detectarNumeroDesdeNombre(file.name);
      const coincidencia = migradas.find((n) => n.numero_original === numeroDetectado);
      return {
        id: `${file.name}-${Date.now()}-${Math.random()}`,
        file,
        numeroInterno: coincidencia ? coincidencia.numero : "",
        estado: "pendiente",
        mensaje: coincidencia ? `Detectado: Nº ${coincidencia.numero_original}` : "No se detectó el número — elegilo a mano",
      };
    });
    setArchivos((prev) => [...prev, ...nuevos]);
  }

  function actualizarNumero(id, numeroInterno) {
    setArchivos((prev) => prev.map((a) => (a.id === id ? { ...a, numeroInterno, mensaje: "" } : a)));
  }

  function quitar(id) {
    setArchivos((prev) => prev.filter((a) => a.id !== id));
  }

  const [subiendoTodo, setSubiendoTodo] = useState(false);

  async function subirTodos() {
    setSubiendoTodo(true);
    for (const a of archivos) {
      if (a.estado === "ok" || !a.numeroInterno) continue;
      setArchivos((prev) => prev.map((x) => (x.id === a.id ? { ...x, estado: "subiendo", mensaje: "" } : x)));
      try {
        const bytes = await a.file.arrayBuffer();
        const res = await fetch(`${API_BASE}/nc/${a.numeroInterno}/documento`, {
          method: "PUT",
          headers: { "Content-Type": "application/vnd.openxmlformats-officedocument.wordprocessingml.document" },
          body: bytes,
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || `Error ${res.status}`);
        }
        setArchivos((prev) => prev.map((x) => (x.id === a.id ? { ...x, estado: "ok", mensaje: "Subido" } : x)));
      } catch (e) {
        setArchivos((prev) => prev.map((x) => (x.id === a.id ? { ...x, estado: "error", mensaje: e.message } : x)));
      }
    }
    setSubiendoTodo(false);
    if (onSubido) onSubido();
  }

  return (
    <div className="bg-white rounded-lg border border-slate-200 p-5 space-y-4">
      <div>
        <h3 className="text-sm font-semibold text-slate-800">Cargar documentos Word históricos</h3>
        <p className="text-xs text-slate-500 mt-1">
          Para NC migradas del histórico que ya tenías documentadas en Word antes de esta app (las oportunidades de mejora se cargan en la solapa "Cargar OM históricas"). Arrastrá o seleccioná
          varios .docx a la vez — si el nombre de archivo incluye el número de NC, se detecta solo.
        </p>
      </div>

      <label className="flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-lg p-6 cursor-pointer hover:border-slate-400 text-sm text-slate-500">
        Arrastrá archivos .docx acá o hacé clic para elegirlos
        <input
          type="file"
          accept=".docx"
          multiple
          className="hidden"
          onChange={(e) => {
            agregarArchivos(e.target.files);
            e.target.value = "";
          }}
        />
      </label>

      {archivos.length > 0 && (
        <div className="space-y-2">
          {archivos.map((a) => (
            <div key={a.id} className="flex items-center gap-3 border border-slate-200 rounded-md p-2 text-sm">
              <span className="flex-1 truncate text-slate-700" title={a.file.name}>{a.file.name}</span>
              <select
                value={a.numeroInterno}
                onChange={(e) => actualizarNumero(a.id, Number(e.target.value))}
                disabled={a.estado === "ok" || a.estado === "subiendo"}
                className="border border-slate-300 rounded-md px-2 py-1 text-xs"
              >
                <option value="">Elegir NC…</option>
                {migradas.map((n) => (
                  <option key={n.numero} value={n.numero}>
                    Nº {n.numero_original} — {n.producto || ""}
                  </option>
                ))}
              </select>
              <span
                className={`text-xs whitespace-nowrap ${
                  a.estado === "ok" ? "text-green-600" : a.estado === "error" ? "text-red-600" : "text-slate-400"
                }`}
              >
                {a.estado === "subiendo" ? "Subiendo…" : a.mensaje}
              </span>
              {a.estado !== "subiendo" && (
                <button type="button" onClick={() => quitar(a.id)} className="text-slate-400 hover:text-slate-600">
                  ×
                </button>
              )}
            </div>
          ))}
          <button
            type="button"
            onClick={subirTodos}
            disabled={subiendoTodo || archivos.every((a) => !a.numeroInterno || a.estado === "ok")}
            className="mt-2 px-4 py-2 rounded-md text-sm font-medium bg-slate-800 text-white disabled:opacity-50"
          >
            {subiendoTodo ? "Subiendo…" : "Subir todos"}
          </button>
        </div>
      )}
    </div>
  );
}

function Q11Dashboard() {
  const [tab, setTab] = useState("general");
  const [registros, setRegistros] = useState([]);
  const [ncRaw, setNcRaw] = useState([]);
  const [operariosData, setOperariosData] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState("");

  function recargarTodo() {
    return Promise.all([
      fetch(`${API_BASE}/nc`).then((r) => r.json()),
      fetch(`${API_BASE}/nc/operarios`).then((r) => r.json()),
    ])
      .then(([nc, ops]) => {
        setRegistros(nc.map(mapNC));
        setNcRaw(nc);
        setOperariosData(ops);
      })
      .catch((e) => setError("No se pudo conectar con la base de datos: " + e.message))
      .finally(() => setCargando(false));
  }

  useEffect(() => {
    recargarTodo();
  }, []);

  return (
    <div className="w-full max-w-5xl mx-auto p-6 bg-slate-50 min-h-screen">
      <div className="mb-6">
        <p className="text-xs font-medium text-slate-500 tracking-wide uppercase">Silver Industrial · Gestión de calidad</p>
        <h1 className="text-xl font-semibold text-slate-800 mt-1">Q.11 2.0 — Registro y estadísticas de No Conformidades</h1>
        <p className="text-sm text-slate-500 mt-1">
          {cargando ? "Cargando..." : `${registros.length} NC registradas · conectado en vivo a Neon`}
        </p>
      </div>

      {error && <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-md p-3 mb-4">{error}</div>}

      <div className="flex gap-2 mb-5">
        <button type="button" onClick={() => setTab("general")} className={`px-4 py-2 rounded-md text-sm font-medium border ${tab === "general" ? "bg-slate-800 text-white border-slate-800" : "bg-white text-slate-600 border-slate-300"}`}>
          Vista general
        </button>
        <button type="button" onClick={() => setTab("operarios")} className={`px-4 py-2 rounded-md text-sm font-medium border ${tab === "operarios" ? "bg-slate-800 text-white border-slate-800" : "bg-white text-slate-600 border-slate-300"}`}>
          Operarios (RRHH)
        </button>
        <button type="button" onClick={() => setTab("exportQ11")} className={`px-4 py-2 rounded-md text-sm font-medium border ${tab === "exportQ11" ? "bg-slate-800 text-white border-slate-800" : "bg-white text-slate-600 border-slate-300"}`}>
          Exportar Q.11 (formato oficial)
        </button>
        <button type="button" onClick={() => setTab("q25")} className={`px-4 py-2 rounded-md text-sm font-medium border ${tab === "q25" ? "bg-slate-800 text-white border-slate-800" : "bg-white text-slate-600 border-slate-300"}`}>
          Q.25 · Oportunidades de mejora
        </button>
        <button type="button" onClick={() => setTab("cargaOM")} className={`px-4 py-2 rounded-md text-sm font-medium border ${tab === "cargaOM" ? "bg-slate-800 text-white border-slate-800" : "bg-white text-slate-600 border-slate-300"}`}>
          Cargar OM históricas
        </button>
        <button type="button" onClick={() => setTab("cargaHistorica")} className={`px-4 py-2 rounded-md text-sm font-medium border ${tab === "cargaHistorica" ? "bg-slate-800 text-white border-slate-800" : "bg-white text-slate-600 border-slate-300"}`}>
          Cargar Word históricos
        </button>
      </div>

      {cargando ? (
        <p className="text-sm text-slate-400">Cargando datos...</p>
      ) : tab === "general" ? (
        <VistaGeneral registros={registros} />
      ) : tab === "operarios" ? (
        <VistaOperarios ncRaw={ncRaw} operariosData={operariosData} />
      ) : tab === "exportQ11" ? (
        <VistaExportQ11 ncRaw={ncRaw} operariosData={operariosData} />
      ) : tab === "q25" ? (
        <VistaQ25 />
      ) : tab === "cargaOM" ? (
        <VistaCargaOM onCambio={recargarTodo} />
      ) : (
        <VistaCargaHistorica ncRaw={ncRaw} onSubido={recargarTodo} />
      )}

      <p className="text-xs text-slate-400 mt-6">
        Conectado en vivo a la base de datos — cada NC que se carga en la app aparece acá automáticamente.
      </p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Q11Dashboard />);

</script>
</body>
